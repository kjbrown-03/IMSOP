# =============================================================================
# IMSOP — configuration nginx pour un VPS de production
#
# Topologie visée :
#
#     Internet ── HTTPS ──> nginx (ce fichier, port 443)
#                              │
#                              ├── /            → build statique du front (dist/)
#                              ├── /api/…       → backend Node, 127.0.0.1:4000
#                              └── /socket.io/… → backend Node (WebSocket, appels vidéo)
#
# Le backend Node écoute UNIQUEMENT sur 127.0.0.1 (HOST=127.0.0.1) : il n'est
# donc joignable que par ce nginx, jamais directement depuis Internet ou le LAN.
# Couplé à TRUST_PROXY=loopback côté Node, cela ferme le contournement du
# rate-limit par usurpation de X-Forwarded-For : nginx RÉÉCRIT l'en-tête avec
# l'IP réelle (voir proxy_set_header plus bas), et Node ne fait confiance qu'à
# 127.0.0.1. Un client ne peut plus remettre son compteur à zéro.
#
# À adapter avant usage : server_name, chemins des certificats, racine du build.
# Installer : copier dans /etc/nginx/sites-available/imsop.conf, puis
#   ln -s /etc/nginx/sites-available/imsop.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# =============================================================================

# --- Redirige tout le trafic clair vers HTTPS -------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name imsop.example.org;          # ← à remplacer par votre domaine

    # Laisse passer le challenge Let's Encrypt (certbot) en clair.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Site principal en HTTPS -------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name imsop.example.org;          # ← à remplacer par votre domaine

    # --- Certificats TLS (ex. Let's Encrypt / certbot) ----------------------
    ssl_certificate     /etc/letsencrypt/live/imsop.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/imsop.example.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS : la même politique que helmet côté Node, posée aussi ici pour
    # couvrir les réponses servies directement par nginx (fichiers statiques).
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    # Documents médicaux : uploads jusqu'à 25 Mo (voir middleware/upload.js),
    # on laisse un peu de marge.
    client_max_body_size 30m;

    # Taille de corps pour le reste : les payloads JSON sont plafonnés à 2 Mo
    # côté Node ; nginx peut rester généreux, Node refusera au-delà.

    # --- Front : build statique de Vite (dist/) -----------------------------
    root /var/www/imsop/dist;               # ← où vous déposez `npm run build`
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;   # SPA : tout retombe sur index.html
    }

    # Cache long pour les assets fingerprintés (index-<hash>.js/.css).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- En-têtes de proxy communs (rate-limit correct) ---------------------
    # $remote_addr = l'IP réelle du client vue par nginx. On ÉCRASE le XFF au
    # lieu de l'ajouter ($proxy_add_x_forwarded_for) : ainsi un client ne peut
    # pas injecter une fausse IP à gauche de la chaîne. C'est cette valeur que
    # Node lit comme IP source pour le rate-limit et les logs d'audit.

    # --- API : backend Node -------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;   # ÉCRASE, n'ajoute pas
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # --- Signalisation WebRTC (appels vidéo) : WebSocket --------------------
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # Handshake WebSocket : ces deux en-têtes sont obligatoires.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Un appel vidéo garde la socket ouverte longtemps : pas de coupure à 60s.
        proxy_read_timeout  1h;
        proxy_send_timeout  1h;
    }
}
