# =============================================================================
# IMSOP — configuration de recette, avant le nom de domaine.
#
# Sert l'application sur 127.0.0.1:8080 UNIQUEMENT. Rien n'est exposé à
# Internet : on l'atteint depuis son poste par un tunnel SSH.
#
#     ssh -L 8080:127.0.0.1:8080 imsop@<IP-DU-VPS>
#     puis http://localhost:8080 dans le navigateur
#
# Pourquoi ce détour plutôt que d'ouvrir le port 80 le temps des essais : en
# clair, un mot de passe et un code de vérification à deux facteurs circulent
# lisiblement. Pour une plateforme qui manipule des dossiers médicaux, prendre
# cette habitude « juste pour tester » est précisément ce qui finit en
# production.
#
# Installer :
#   sudo cp deploy/nginx/imsop-tunnel.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/imsop-tunnel.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# À retirer une fois le vrai domaine en service (voir imsop.conf).
# =============================================================================

server {
    listen 127.0.0.1:8080;
    server_name localhost;

    client_max_body_size 30m;

    root /opt/imsop/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;   # SPA : tout retombe sur index.html
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  1h;
        proxy_send_timeout  1h;
    }
}
