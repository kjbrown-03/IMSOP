# =============================================================================
# IMSOP — pile de production pour un VPS.
#
# Topologie : nginx tourne SUR L'HÔTE (voir deploy/nginx/imsop.conf) et parle au
# backend par 127.0.0.1:4000. Aucun service de ce fichier n'est joignable depuis
# Internet — les ports publiés le sont tous sur la boucle locale.
#
#     Internet ──443──> nginx (hôte) ──> 127.0.0.1:4000 ──> backend (conteneur)
#                                                              │
#                                                    postgres ─┴─ garage
#                                                    (réseau interne seulement)
#
# Garage remplace MinIO, dont les images ne sont plus publiques. Il stocke les
# documents sur le disque du VPS : leur sauvegarde régulière hors de cette
# machine est donc indispensable, pas optionnelle.
#
# Lancement :   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production up -d
# Migrations :  docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production run --rm migrate
# =============================================================================

name: imsop

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Les sauvegardes et les journaux sont datés : sans ce réglage, ils le
      # seraient dans le fuseau de l'image (UTC), pas dans celui du service.
      TZ: Africa/Douala
    volumes:
      - pg_data:/var/lib/postgresql/data
    # Pas de `ports:` — la base ne sort pas du réseau Docker. Pour l'inspecter,
    # on passe par `docker compose exec postgres psql`, jamais par Internet.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  # Stockage objet compatible S3. Aucun port publié : seul le backend lui parle,
  # par le réseau Docker. L'exposer serait offrir les documents médicaux à qui
  # devinerait une clé.
  garage:
    image: dxflrs/garage:v2.1.0
    restart: unless-stopped
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data

  # Relais pour les appels audio/vidéo.
  #
  # STUN seul ne suffit pas entre deux réseaux mobiles : les opérateurs placent
  # leurs abonnés derrière un NAT symétrique, et l'appel sonne puis échoue parce
  # qu'aucun des deux navigateurs ne peut recevoir l'autre. coturn relaie alors
  # le flux.
  #
  # `network_mode: host` n'est pas un raccourci : un relais TURN ouvre un port
  # par appel dans une plage, et publier cette plage à travers la couche réseau
  # de Docker coûte un processus de redirection par port. Il a aussi besoin de
  # voir l'adresse réelle des clients pour fabriquer des candidats joignables.
  #
  # L'isolation ne vient donc pas de Docker ici, mais de la configuration :
  # `denied-peer-ip` dans turnserver.conf interdit tout relais vers les réseaux
  # internes, sans quoi le service deviendrait une porte vers PostgreSQL, Garage
  # et le backend.
  coturn:
    image: coturn/coturn:4.6-alpine
    restart: unless-stopped
    # L'image tourne sous `nobody` (65534), qui ne peut pas lire un
    # turnserver.conf en 600 appartenant au compte de déploiement. coturn
    # démarre alors SANS SA CONFIGURATION, en silence : il écoute sur toutes les
    # interfaces, annonce les passerelles Docker comme adresses de relais, et
    # n'applique aucun des `denied-peer-ip`. On l'a observé.
    #
    # Deux issues : rendre le fichier lisible par tous — il contient le secret —,
    # ou faire tourner le conteneur sous le propriétaire du fichier. C'est la
    # seconde, l'uid reste non privilégié et aucun port sous 1024 n'est demandé.
    user: '1000:1000'
    network_mode: host
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: ['-c', '/etc/coturn/turnserver.conf']

  # Applique les migrations puis se retire. Séparé du backend pour que deux
  # instances ne migrent jamais en même temps, et pour que l'échec d'une
  # migration se voie tout de suite au lieu de boucler dans un redémarrage.
  migrate:
    build:
      context: ../backend
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    command: ['npx', 'prisma', 'migrate', 'deploy']
    restart: 'no'
    # Un profil met ce service à l'écart de `up -d` : il ne démarre que sur un
    # `run --rm migrate` explicite. Sans ça, chaque démarrage de la pile
    # relancerait une migration, et le conteneur traînerait dans la liste.
    profiles: ['outils']

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    env_file: .env.production
    environment:
      # Ces valeurs dépendent de la topologie Docker, pas du déploiement :
      # elles sont donc écrites ici plutôt que dans le fichier d'environnement.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # S3_ENDPOINT vient du fichier d'environnement : il pointe sur le
      # fournisseur, pas sur un conteneur voisin.
      # Dans un conteneur, écouter sur 127.0.0.1 rendrait le service injoignable
      # même par nginx : l'isolation vient du `ports:` ci-dessous, qui ne publie
      # que sur la boucle locale de l'hôte.
      HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_started
    ports:
      - '127.0.0.1:4000:4000'
    volumes:
      # Les sauvegardes doivent survivre à la reconstruction de l'image.
      - ./backups:/app/backups

volumes:
  pg_data:
  garage_meta:
  garage_data:
