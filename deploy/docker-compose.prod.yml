# =============================================================================
# IMSOP — pile de production pour un VPS.
#
# Topologie : nginx tourne SUR L'HÔTE (voir deploy/nginx/imsop.conf) et parle au
# backend par 127.0.0.1:4000. Aucun service de ce fichier n'est joignable depuis
# Internet — les ports publiés le sont tous sur la boucle locale.
#
#     Internet ──443──> nginx (hôte) ──> 127.0.0.1:4000 ──> backend (conteneur)
#                                                              │
#                                                    postgres ─┴─ minio
#                                                    (réseau interne seulement)
#
# Lancement :   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production up -d
# Migrations :  docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production run --rm migrate
# =============================================================================

name: imsop

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Les sauvegardes et les journaux sont datés : sans ce réglage, ils le
      # seraient dans le fuseau de l'image (UTC), pas dans celui du service.
      TZ: Africa/Douala
    volumes:
      - pg_data:/var/lib/postgresql/data
    # Pas de `ports:` — la base ne sort pas du réseau Docker. Pour l'inspecter,
    # on passe par `docker compose exec postgres psql`, jamais par Internet.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - minio_data:/data
    # La console d'administration n'est publiée que sur la boucle locale : on y
    # accède par un tunnel SSH (ssh -L 9001:127.0.0.1:9001), pas depuis le web.
    ports:
      - '127.0.0.1:9001:9001'
    healthcheck:
      # Le point de santé HTTP de MinIO, plutôt que `mc ready local` : celui-ci
      # suppose un alias déjà configuré dans le conteneur, ce qui n'est pas
      # garanti. Une sonde qui échoue bloquerait le démarrage du backend.
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 10

  # Crée le bucket au premier démarrage, puis s'arrête. Sans lui, le premier
  # dépôt de document échouerait sur un bucket inexistant.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set imsop http://minio:9000 ${S3_ACCESS_KEY_ID} ${S3_SECRET_ACCESS_KEY} &&
      mc mb --ignore-existing imsop/${S3_BUCKET} &&
      mc anonymous set none imsop/${S3_BUCKET}
      "
    restart: 'no'

  # Applique les migrations puis se retire. Séparé du backend pour que deux
  # instances ne migrent jamais en même temps, et pour que l'échec d'une
  # migration se voie tout de suite au lieu de boucler dans un redémarrage.
  migrate:
    build:
      context: ../backend
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    command: ['npx', 'prisma', 'migrate', 'deploy']
    restart: 'no'

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    env_file: .env.production
    environment:
      # Ces trois-là dépendent de la topologie Docker, pas du déploiement :
      # elles sont donc écrites ici plutôt que dans le fichier d'environnement.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      S3_ENDPOINT: http://minio:9000
      # Dans un conteneur, écouter sur 127.0.0.1 rendrait le service injoignable
      # même par nginx : l'isolation vient du `ports:` ci-dessous, qui ne publie
      # que sur la boucle locale de l'hôte.
      HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - '127.0.0.1:4000:4000'
    volumes:
      # Les sauvegardes doivent survivre à la reconstruction de l'image.
      - ./backups:/app/backups

volumes:
  pg_data:
  minio_data:
