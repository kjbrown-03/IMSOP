services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: imsop
      POSTGRES_PASSWORD: imsop
      POSTGRES_DB: imsop
    ports:
      - '5432:5432'
    volumes:
      - imsop_pg_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - imsop_minio_data:/data

volumes:
  imsop_pg_data:
  imsop_minio_data:
