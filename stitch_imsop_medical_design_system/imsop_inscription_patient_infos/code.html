<!DOCTYPE html>

<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9f9ff;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
        /* Hide bottom nav on desktop, hide top full nav on mobile */
        @media (min-width: 768px) {
            .mobile-bottom-nav { display: none !important; }
        }
        @media (max-width: 767px) {
            .desktop-top-nav-links { display: none !important; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background antialiased flex flex-col min-h-screen">
<!-- Header (Suppressed bottom nav for linear flow, keeping top bar minimal) -->
<header class="bg-surface dark:bg-surface-dim fixed top-0 w-full z-50 border-b border-outline-variant dark:border-outline flat no shadows flex justify-between items-center px-margin-mobile h-12 w-full">
<div class="flex items-center gap-3">
<!-- Back Button for task-focused flow -->
<button class="text-on-surface-variant hover:bg-surface-container-high transition-colors active:opacity-80 rounded-full p-1 flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md-mobile font-bold text-primary dark:text-primary-fixed">IMSOP</h1>
</div>
<div>
<!-- Suppress trailing icon for this linear flow to focus on task -->
<div class="w-8 h-8"></div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-[48px] px-margin-mobile pb-24 md:pb-8 flex flex-col items-center md:max-w-[1200px] md:mx-auto w-full">
<!-- Form Container -->
<div class="w-full max-w-lg mt-stack-md flex flex-col gap-stack-lg">
<!-- Header Section -->
<div class="text-center md:text-left">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-2">Informations Personnelles</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Veuillez renseigner vos informations pour créer votre dossier médical sécurisé.</p>
</div>
<!-- Stepper -->
<div class="w-full flex items-center justify-between relative px-2">
<!-- Background Line -->
<div class="absolute top-1/2 left-0 right-0 h-[2px] bg-outline-variant -z-10 transform -translate-y-1/2 mx-6"></div>
<!-- Active Progress Line -->
<div class="absolute top-1/2 left-0 w-[0%] h-[2px] bg-primary -z-10 transform -translate-y-1/2 mx-6 transition-all duration-300"></div>
<!-- Step 1: Active -->
<div class="flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full bg-primary text-on-primary flex items-center justify-center font-label-md text-label-md shadow-sm">
                        1
                    </div>
<span class="font-label-sm text-label-sm text-primary">Infos</span>
</div>
<!-- Step 2: Inactive -->
<div class="flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full bg-surface-container-highest text-outline flex items-center justify-center font-label-md text-label-md border border-outline-variant">
                        2
                    </div>
<span class="font-label-sm text-label-sm text-outline">Détails</span>
</div>
<!-- Step 3: Inactive -->
<div class="flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full bg-surface-container-highest text-outline flex items-center justify-center font-label-md text-label-md border border-outline-variant">
                        3
                    </div>
<span class="font-label-sm text-label-sm text-outline">Validation</span>
</div>
</div>
<!-- Form Fields -->
<form action="#" class="flex flex-col gap-stack-md bg-surface-container-lowest p-6 rounded-xl border border-outline-variant shadow-sm" method="POST">
<!-- Full Name -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface" for="fullName">Nom Complet</label>
<input class="h-12 px-4 rounded-lg border border-outline-variant bg-surface focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-body-md text-on-surface placeholder:text-outline-variant transition-colors" id="fullName" name="fullName" placeholder="Ex: Jean Dupont" required="" type="text"/>
</div>
<!-- Date of Birth -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface" for="dob">Date de Naissance</label>
<input class="h-12 px-4 rounded-lg border border-outline-variant bg-surface focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-body-md text-on-surface transition-colors" id="dob" name="dob" required="" type="date"/>
</div>
<!-- Gender -->
<div class="flex flex-col gap-2 mt-2">
<span class="font-label-md text-label-md text-on-surface">Genre</span>
<div class="flex gap-4">
<label class="flex items-center gap-2 cursor-pointer">
<input class="w-5 h-5 text-primary border-outline-variant focus:ring-primary focus:ring-offset-background" name="gender" type="radio" value="homme"/>
<span class="font-body-md text-body-md text-on-surface-variant">Homme</span>
</label>
<label class="flex items-center gap-2 cursor-pointer">
<input class="w-5 h-5 text-primary border-outline-variant focus:ring-primary focus:ring-offset-background" name="gender" type="radio" value="femme"/>
<span class="font-body-md text-body-md text-on-surface-variant">Femme</span>
</label>
<label class="flex items-center gap-2 cursor-pointer">
<input class="w-5 h-5 text-primary border-outline-variant focus:ring-primary focus:ring-offset-background" name="gender" type="radio" value="autre"/>
<span class="font-body-md text-body-md text-on-surface-variant">Autre</span>
</label>
</div>
</div>
<!-- Phone Number -->
<div class="flex flex-col gap-1 mt-2">
<label class="font-label-md text-label-md text-on-surface" for="phone">Numéro de Téléphone</label>
<div class="flex relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-outline material-symbols-outlined text-[20px]" data-icon="phone">phone</span>
<input class="h-12 w-full pl-11 pr-4 rounded-lg border border-outline-variant bg-surface focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-body-md text-on-surface placeholder:text-outline-variant transition-colors" id="phone" name="phone" placeholder="+33 6 12 34 56 78" required="" type="tel"/>
</div>
</div>
<!-- Country of Residence -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface" for="country">Pays de Résidence</label>
<div class="relative">
<select class="h-12 w-full px-4 pr-10 appearance-none rounded-lg border border-outline-variant bg-surface focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-body-md text-on-surface transition-colors cursor-pointer" id="country" name="country" required="">
<option disabled="" selected="" value="">Sélectionnez un pays</option>
<option value="sn">Sénégal</option>
<option value="ci">Côte d'Ivoire</option>
<option value="cm">Cameroun</option>
<option value="fr">France</option>
<option value="be">Belgique</option>
<option value="ch">Suisse</option>
</select>
<span class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-outline material-symbols-outlined" data-icon="expand_more">expand_more</span>
</div>
</div>
</form>
<!-- Fixed Bottom Action Area (Mobile) / Normal Flow (Desktop) -->
<div class="fixed bottom-0 left-0 w-full p-margin-mobile bg-surface/90 backdrop-blur-sm border-t border-outline-variant/50 md:relative md:bg-transparent md:border-none md:p-0 md:mt-4 z-40">
<div class="max-w-lg mx-auto w-full">
<button class="w-full h-12 flex items-center justify-center bg-primary text-on-primary rounded-xl font-label-md text-label-md hover:bg-primary-fixed-variant transition-colors shadow-sm active:scale-[0.98]" type="button">
                        Suivant
                        <span class="material-symbols-outlined ml-2 text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</div>
</div>
</main>
<!-- Note: BottomNavBar is intentionally suppressed here as this is a linear/transactional onboarding flow -->
</body></html>
