<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1;
        }
    </style>

<body class="bg-background min-h-screen flex items-center justify-center font-body-md text-on-background p-margin-mobile">
<!-- Transactional / Login screen - Navigation shell is suppressed according to logic -->
<main class="w-full max-w-md bg-surface rounded-xl shadow-md border border-outline-variant overflow-hidden">
<!-- Header -->
<div class="p-6 md:p-8 bg-surface-container-low border-b border-outline-variant flex flex-col items-center">
<!-- Logo Placeholder -->
<div class="h-12 w-12 rounded-full bg-primary-container text-primary flex items-center justify-center mb-4">
<span class="material-symbols-outlined text-3xl">medical_services</span>
</div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-2 text-center">
                Portail IMSOP
            </h1>
<div class="bg-primary/10 text-primary px-3 py-1 rounded-full font-label-sm text-label-sm flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">verified_user</span>
                Accès Praticien
            </div>
</div>
<!-- Login Form -->
<div class="p-6 md:p-8 space-y-stack-md">
<p class="font-body-md text-body-md text-on-surface-variant text-center mb-6">
                Veuillez vous authentifier pour accéder aux dossiers médicaux sécurisés.
            </p>
<form action="#" class="space-y-4" method="POST">
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="email">Adresse Email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg bg-surface text-on-surface focus:ring-primary focus:border-primary sm:text-sm font-body-md" id="email" name="email" placeholder="dr.nom@hopital.fr" required="" type="email"/>
</div>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="password">Mot de passe</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-3 border border-outline-variant rounded-lg bg-surface text-on-surface focus:ring-primary focus:border-primary sm:text-sm font-body-md" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<div class="flex items-center justify-between mt-2">
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline-variant rounded" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-label-md text-label-md text-on-surface-variant" for="remember-me">
                            Se souvenir de moi
                        </label>
</div>
<div class="text-sm">
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">
                            Mot de passe oublié ?
                        </a>
</div>
</div>
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-on-primary bg-primary hover:bg-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary font-label-md text-label-md transition-colors duration-200 mt-stack-md h-12 items-center" type="submit">
<span class="material-symbols-outlined mr-2">login</span>
                    Connexion Sécurisée
                </button>
</form>
</div>
<!-- Footer / Support -->
<div class="p-6 bg-surface-container-lowest border-t border-outline-variant text-center">
<p class="font-body-md text-body-md text-on-surface-variant text-sm">
                Problème d'accès ? 
                <a class="font-label-md text-label-md text-primary hover:underline inline-flex items-center gap-1" href="#">
                    Contacter le support technique
                    <span class="material-symbols-outlined text-[14px]">support_agent</span>
</a>
</p>
</div>
</main>
</body></html>
